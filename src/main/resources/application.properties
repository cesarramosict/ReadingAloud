spring.application.name=readingaloud
# Read secret variables from the .env file (not versioned)
spring.config.import=optional:file:.env[.properties]

# Database (MariaDB via XAMPP)
spring.datasource.url=jdbc:mariadb://localhost:3306/readingaloud?useSSL=false&serverTimezone=Europe/Brussels
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway: accept a database that already exists
spring.flyway.baseline-on-migrate=true

# Forms PUT / DELETE via hidden _method field
spring.mvc.hiddenmethod.filter.enabled=true